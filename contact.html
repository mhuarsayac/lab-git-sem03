<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatos - Contacto</title>
</head>

<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0;">

    <nav style="background-color: #333; padding: 15px; text-align: center;">
        <a href="index.html" style="color: white; text-decoration: none; margin: 15px;">Inicio</a>
        <a href="about.html" style="color: white; text-decoration: none; margin: 15px;">Sobre los gatos</a>
        <a href="contact.html" style="color: white; text-decoration: none; margin: 15px;">Contacto</a>
    </nav>

    <main style="max-width: 800px; margin: 40px auto; background-color: white; padding: 30px; border-radius: 10px;">
        <h1 style="color: #444;">Contacto</h1>

        <p style="font-size: 18px;">
            Si quieres saber más sobre los gatos, puedes enviarnos un mensaje.
        </p>

        <form>
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre"
                   style="width: 100%; padding: 10px; margin: 8px 0 15px; box-sizing: border-box;">

            <label for="correo">Correo electrónico:</label><br>
            <input type="email" id="correo" name="correo"
                   style="width: 100%; padding: 10px; margin: 8px 0 15px; box-sizing: border-box;">

            <label for="mensaje">Mensaje:</label><br>
            <textarea id="mensaje" name="mensaje" rows="5"
                      style="width: 100%; padding: 10px; margin: 8px 0 15px; box-sizing: border-box;"></textarea>

            <button type="submit"
                    style="background-color: #333; color: white; padding: 10px 20px; border: none; border-radius: 5px;">
                Enviar
            </button>
        </form>
    </main>

</body>
</html>
